name: Flutter CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'chore/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'Build release-mode Android APK artifact'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

jobs:
  flutter_checks:
    name: Flutter checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.3'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Run static analysis
        run: flutter analyze

      - name: Run unit & widget tests
        run: flutter test

  build_release_apk:
    name: Build Release APK (Manual / Tag)
    needs: flutter_checks
    if: github.event_name == 'workflow_dispatch' && inputs.build_apk == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.3'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release-mode APK
        run: flutter build apk --release

      - name: Compute SHA-256 and inspect merged manifest for INTERNET permission
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          cp "$APK_PATH" LifeVault-Lite-v0.1-release-mode.apk
          sha256sum LifeVault-Lite-v0.1-release-mode.apk | tee apk-sha256.txt

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LifeVault-Lite-v0.1-release-mode
          path: |
            LifeVault-Lite-v0.1-release-mode.apk
            apk-sha256.txt
